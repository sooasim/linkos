# Render Blueprint — LINKOS test deployment (free plan, one click).
#   Deploy: https://render.com/deploy?repo=https://github.com/sooasim/linkos
#   Render reads this file, creates the Postgres database and the web service, and fills every secret itself.
#   The public URL (https://linkos-web-XXXX.onrender.com) appears on the service page when the first deploy ends.
#
# Test-server settings:
#   - DEMO_LOGIN=1 shows "테스트 계정으로 바로 시작" on /login (a throwaway account, no e-mail). Set it to 0, and
#     set SMTP_URL, before using this for real people — real e-mail login needs a mail server.
#   - One container runs migrations, the outbox worker (background) and the web app (`entrypoint.sh all`).
#     For production, switch to paid plans and split the worker out (see docs/RUNBOOK.md "배포").
#   - Free Render services sleep after ~15 minutes idle (the first request then takes ~1 minute) and the free
#     database expires after 30 days.
databases:
  - name: linkos-db
    plan: free
    databaseName: linkos
    postgresMajorVersion: "16"
services:
  - type: web
    name: linkos-web
    plan: free
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: /bin/sh /entrypoint.sh all
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: linkos-db, property: connectionString }
      - key: AUTH_SECRET
        generateValue: true
      - key: CREDENTIALS_KEY
        generateValue: true
      - key: DEMO_LOGIN
        value: "1"
      - key: BILLING_ENFORCEMENT
        value: "off"
      # Optional — leave empty for a test server. APP_ORIGIN defaults to the Render URL.
      - key: APP_ORIGIN
        sync: false
      - key: SMTP_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
