# PROPLUS CI — LINKOS 의 ci.yml 과 분리돼 있다.
#
# 왜 분리하는가: proplus/ 는 별개 제품이고 별개 데이터베이스를 쓴다(전략 §1).
# 한 잡에서 두 제품의 마이그레이션을 같은 DB 에 돌리면 schema_migrations 가 섞인다.
# paths 필터로 proplus/ 가 바뀔 때만 돌려 PR 시간을 낭비하지 않는다.
name: PROPLUS CI
on:
  push:
    branches: [main]
    paths:
      - "proplus/**"
      - ".github/workflows/proplus-ci.yml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "tsconfig.base.json"
  pull_request:
    paths:
      - "proplus/**"
      - ".github/workflows/proplus-ci.yml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "tsconfig.base.json"

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      # 운영 서버가 PostgreSQL **14** 클러스터다(docs/DEPLOY_CKP.md). CI 를 16 으로 올리면
      # 14 에 없는 문법이 통과해 버리고, 그 실패가 배포 시점까지 미뤄진다.
      # 로컬(proplus/infra/docker-compose.yml)도 14 로 맞춰져 있다.
      postgres:
        image: postgres:14
        env: { POSTGRES_USER: proplus, POSTGRES_PASSWORD: proplus, POSTGRES_DB: proplus_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U proplus" --health-interval 5s --health-retries 20
    env:
      # lib/db.ts 는 PROPLUS_DATABASE_URL 을 먼저 본다. 둘 다 같은 값을 주어
      # 마이그레이션 러너·시드·테스트가 어느 변수를 읽든 같은 DB 를 가리키게 한다.
      PROPLUS_DATABASE_URL: postgres://proplus:proplus@localhost:5432/proplus_test
      DATABASE_URL: postgres://proplus:proplus@localhost:5432/proplus_test
      AUTH_SECRET: ci-only-secret
      # crypto.ts 가 요구하는 32바이트 base64 키. CI 전용 값이다.
      # base64 of exactly 32 bytes ("ci-only-field-key-exactly-32byte"). crypto.ts 는 32바이트를 요구한다 —
      # 이전 값은 디코딩하면 31바이트라 모든 암호화 테스트가 터졌다.
      FIELD_KEY: Y2ktb25seS1maWVsZC1rZXktZXhhY3RseS0zMmJ5dGU=
      STORAGE_SIGNING_KEY: ci-only-storage-key
      APP_ORIGIN: http://127.0.0.1:4400
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Typecheck (@proplus/*)
        run: pnpm proplus:typecheck

      - name: Migration is idempotent (두 번 돌려도 같다)
        run: pnpm proplus:migrate && pnpm proplus:migrate

      # 시드는 멱등해야 한다 — 두 번 돌려 FK 정리 누락을 잡는다(실제로 한 번 깨져 있었다).
      - name: Seed is idempotent
        run: pnpm proplus:db:seed && pnpm proplus:db:seed

      # 통합테스트는 DB 가 있을 때만 실제로 돈다(없으면 skip). CI 에는 Postgres 가 있으므로 여기서 돈다.
      - name: Unit + integration tests
        run: pnpm proplus:test

      # CLAUDE.md §1 / 전략 §9: 테스트가 없는 기능을 done 으로 표시하지 않는다.
      # 이 게이트가 원장과 코드의 괴리를 기계적으로 잡는다.
      - name: Traceability gate (원장 status=done ↔ 테스트 참조)
        run: node proplus/scripts/traceability.mjs --check

      - name: Build
        run: pnpm proplus:build

      # N-9: 정적 프리렌더된 페이지가 있으면 만료·취소된 배지가 재검증 시각까지 공개된다.
      # 빌드도 테스트도 통과하고 화면도 정상으로 보이므로 기계로만 잡을 수 있다.
      - name: No prerendered pages (N-9)
        run: node proplus/scripts/check-no-prerender.mjs

      - run: pnpm exec playwright install --with-deps chromium

      - name: E2E (공개 프로필 · 상담 요청 · 검증 배지 표기)
        run: pnpm exec playwright test -c proplus/playwright.config.ts

      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: proplus-playwright-report, path: playwright-report }

  security:
    # 로드맵 §4 출시 게이트 중 코드로 확인 가능한 항목.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit
        run: node scripts/audit-gate.mjs
      - name: SAST (하드코딩 시크릿, eval, dangerouslySetInnerHTML, 요청 입력으로 만든 SQL)
        run: node scripts/security-scan.mjs
