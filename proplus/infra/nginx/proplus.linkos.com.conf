# proplus.linkos.com — PROPLUS web/API  (P-190, 전략 §10)
#
# 설치 위치: /etc/nginx/sites-available/proplus  →  sites-enabled 심링크
#
#   앱은 Next.js standalone 서버 하나가 화면과 /api/v1/* 를 모두 제공한다 (전략 §3).
#   systemd: proplus-web.service -> 127.0.0.1:4400 (루프백만 바인딩), proplus-worker.service (outbox)
#   같은 서버에서 LINKOS(linkos.ckp.kr, 4300)가 이미 돌고 있다. 포트·존 이름·인증서 경로를
#   전부 다르게 쓰는 이유다 — docs/DEPLOY_CKP.md 의 전제를 깨지 않는다.
#
# ⚠️ TLS — 솔직하게: 이 vhost 가 참조하는 /etc/ssl/proplus/proplus.pem 은 **아직 없다.**
#   기존 /etc/ssl/ckp/pt.pem 은 Cloudflare Origin 와일드카드 `*.ckp.kr` 이라
#   proplus.linkos.com 을 덮지 못한다. 선행 조건(도메인 소유·인증서 발급·DNS)은
#   proplus/docs/03_DEPLOY.md 맨 위에 적어 두었다.
#   선행 조건 미해결 동안은 pt.pem 을 /etc/ssl/proplus/proplus.pem 으로 심링크해
#   `proplus.ckp.kr` 로만 확인한다(그 이름은 *.ckp.kr 인증서가 덮는다).
#   그래서 server_name 에 두 이름을 함께 둔다 — vhost 파일은 그대로 두고 인증서만 교체하면
#   proplus.linkos.com 이 살아난다.
#
# ⚠️ 공통 snippets/ckp-server.conf · ckp-security.conf 를 include 하지 않는다.
#   LINKOS 와 **같은 이유**다: 앱이 apps/web/src/proxy.ts 에서 자기 CSP 를 요청별 nonce 와 함께
#   직접 내려보내고(ADR-011 갱신 2026-10-25 — 그 전에는 next.config.ts 의 headers() 였다),
#   공통 스니펫을 include 하면 CSP 헤더가 둘이 되어 브라우저가 "교집합"을
#   적용한다. PROPLUS 의 CSP 는 N-10(미니사이트에 사용자 JS 금지)을 강제하는 **제품 규칙**이므로
#   nginx 가 임의로 느슨하게/엄하게 바꿔서는 안 된다. 대신 dotfile 차단만 아래에서 따로 한다.
#
# SSE 전용 location 은 두지 않는다 — PROPLUS 에는 실시간 교환 스트림이 없다(LINKOS 의
# /api/v1/exchange/.../events 에 해당하는 경로가 없다). 없는 경로에 프록시 예외를 만들면
# 다음 사람이 "여기 스트림이 있다"고 오해한다.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name proplus.linkos.com proplus.ckp.kr;

    ssl_certificate     /etc/ssl/proplus/proplus.pem;
    ssl_certificate_key /etc/ssl/proplus/proplus.key;

    charset utf-8;

    # 업로드 상한은 증거 파일 최대치(packages/domain MAX_EVIDENCE_BYTES = 10MB)보다 약간 크게 둔다.
    # nginx 가 먼저 413 을 내면 앱의 한글 오류 메시지(file_too_large)와 MIME sniff 검사
    # (보안정책 §2)를 쓸 수 없다.
    client_max_body_size 16m;

    # 숨김 파일 차단. /.well-known/ 은 앱이 직접 서비스한다
    # (조직 도메인 검증·인증서 갱신 경로를 막지 않기 위해서다 — P-072).
    location ~ /\.(?!well-known) { deny all; }

    # ── REST API ────────────────────────────────────────────────────────────
    # 앱 안에도 행위별 레이트리밋이 있다(packages/domain/src/rateLimit.ts — P-189).
    # 여기서는 그보다 훨씬 느슨한 거친 DoS 방어만 한다. 전용 존은 conf.d/proplus.conf 에 있다.
    # 공개 프로필(/p/{slug})이 비회원 트래픽을 받는 입구이므로(전략 §1) 공통 ckp_api(10r/s)
    # 로는 정상 유입이 429 가 된다.
    location ^~ /api/ {
        limit_req zone=proplus_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:4400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 120s;
    }

    # 운영 지표는 외부로 내보내지 않는다(앱 내부·워커 전용).
    location = /api/v1/metrics { return 404; }

    # ── 화면 ────────────────────────────────────────────────────────────────
    # Next.js 가 /_next/static 에 immutable 캐시 헤더를 직접 붙이고 Cloudflare 가 엣지에서
    # 캐시하므로 정적 파일도 그대로 프록시한다(경로가 재배포마다 바뀌지 않음).
    # 증거 원본은 여기로 나가지 않는다 — 단기 signed URL 로만 내보낸다(N-5, 보안정책 §3).
    location / {
        proxy_pass http://127.0.0.1:4400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 120s;
    }

    gzip on;
    gzip_proxied any;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

server {
    listen 80;
    listen [::]:80;
    server_name proplus.linkos.com proplus.ckp.kr;
    return 301 https://$host$request_uri;
}
