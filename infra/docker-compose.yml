# Local/full-stack run: docker compose -f infra/docker-compose.yml up --build
services:
  db:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: linkos, POSTGRES_PASSWORD: linkos, POSTGRES_DB: linkos }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U linkos"], interval: 5s, retries: 20 }
  migrate:
    build: { context: .., dockerfile: Dockerfile }
    command: ["migrate"]
    environment: &env
      DATABASE_URL: postgres://linkos:linkos@db:5432/linkos
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:-change-me-local-only}
      OTP_DEV_ECHO: ${OTP_DEV_ECHO:-1}
      SMTP_URL: ${SMTP_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      CREDENTIALS_KEY: ${CREDENTIALS_KEY:-}
    depends_on: { db: { condition: service_healthy } }
  web:
    build: { context: .., dockerfile: Dockerfile }
    command: ["web"]
    environment: *env
    ports: ["3000:3000"]
    depends_on: { migrate: { condition: service_completed_successfully } }
  worker:
    build: { context: .., dockerfile: Dockerfile }
    command: ["worker"]
    environment: *env
    depends_on: { migrate: { condition: service_completed_successfully } }
volumes:
  pgdata: {}
