name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: linkos, POSTGRES_PASSWORD: linkos, POSTGRES_DB: linkos_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U linkos" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgres://linkos:linkos@localhost:5432/linkos_test
      AUTH_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Contract tests (04_OPENAPI paths/methods/status ↔ route handlers, 06_EVENT_CATALOG ↔ events.ts)
        run: pnpm --filter @linkos/api exec vitest run test/openapi-contract.test.ts
      - name: Unit + integration tests (domain, api against Postgres)
        run: pnpm test
      - name: Migration dry-run is idempotent
        run: pnpm db:migrate && pnpm db:migrate
      - name: Traceability gate (all 197 Feature IDs present)
        run: pnpm traceability --check
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: E2E (guest exchange → claim, QR final fallback)
        run: pnpm e2e
      - name: 100 scenarios (security, concurrency, devices, OCR variants, exports)
        run: pnpm scenarios
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report }
  security:
    # 백서 §21 release gate: dependency vulnerabilities (fail on unaccepted high/critical) + lightweight SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (pnpm audit --prod; high/critical fail unless time-boxed in .github/audit-allowlist.json)
        run: node scripts/audit-gate.mjs
      - name: SAST self-test
        run: node scripts/security-scan.mjs --self-test
      - name: SAST (hard-coded secrets, eval, unsanitized dangerouslySetInnerHTML, SQL built from request input)
        run: node scripts/security-scan.mjs
  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t linkos:ci .
  dr:
    # F-184 백업/복구 · F-186 재해복구: 지금까지 사람이 손으로 돌렸던 리허설을 CI에서 매 PR 검증한다.
    # pg_dump → 별도 DB로 pg_restore → 핵심 테이블 행 수 비교까지 실제로 수행하므로,
    # 복원할 수 없는 마이그레이션이나 매니페스트 불일치가 들어오면 여기서 막힌다.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: linkos, POSTGRES_PASSWORD: linkos, POSTGRES_DB: linkos_dr }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U linkos" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgres://linkos:linkos@localhost:5432/linkos_dr
      ADMIN_URL: postgres://linkos:linkos@localhost:5432/postgres
      AUTH_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      # pg_dump/pg_restore must match the server major version (16), so pin the client instead of
      # relying on whatever the runner image happens to ship.
      - name: PostgreSQL 16 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          pg_dump --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - name: Seed so the drills compare real rows, not 0 == 0
        run: pnpm db:seed
      - name: F-184 restore drill (backup → scratch DB → core table row counts match)
        run: pnpm restore-drill
      - name: F-186 DR copy to two locations + cross-region restore verify (manifest, checksum, RPO/RTO)
        run: |
          pnpm dr:backup
          pnpm dr:verify
        env:
          DR_PRIMARY: ${{ runner.temp }}/dr-primary
          DR_SECONDARY: ${{ runner.temp }}/dr-secondary
          DR_SOURCE: ${{ runner.temp }}/dr-secondary
  mobile:
    # apps/mobile(Expo/React Native)은 네이티브 의존성 때문에 pnpm 워크스페이스에서 제외돼 있어
    # 지금까지 CI 가 한 번도 보지 않았다. @linkos/domain 을 경로로 직접 가져다 쓰므로
    # (tsconfig paths), 도메인 시그니처가 바뀌면 웹·API 는 통과하고 네이티브 앱만 조용히 깨진다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/mobile/package-lock.json }
      - run: npm ci
        working-directory: apps/mobile
      - name: Typecheck the native app against packages/domain
        run: npm run typecheck
        working-directory: apps/mobile
  ios-clip:
    # F-042 iOS App Clip: Swift 소스가 실제로 컴파일되는지 확인한다. 저장소에는 .xcodeproj 가 없고
    # XcodeGen 스펙(project.yml)만 있으므로 먼저 생성한다. DEVELOPMENT_TEAM 은 자리표시자(TEAMID)라
    # 서명은 끄고 시뮬레이터용으로만 빌드한다 — 배포 서명은 Apple 개발자 계정이 있어야 한다.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Generate LinkosClip.xcodeproj from project.yml
        run: xcodegen generate
        working-directory: apps/ios-app-clip
      - name: Build for the simulator (no code signing)
        working-directory: apps/ios-app-clip
        run: |
          xcodebuild build \
            -project LinkosClip.xcodeproj \
            -scheme LinkosClip \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM=
