# /etc/nginx/conf.d/linkos.conf — LINKOS 전용 http 레벨 설정
#
# 공통 conf.d/ckp-hardening.conf 의 ckp_api 존은 10r/s 다. LINKOS 는 화면 한 장이
# 여러 API 를 호출하고(홈 요약·알림·플래그) SSE 재연결도 있어서 그 한도로는 정상
# 사용이 429 가 된다. 같은 키($ckp_client_ip: Cloudflare 복원 클라이언트 IP)를 쓰는
# 느슨한 전용 존을 따로 둔다. 세밀한 행위별 제한은 앱(packages/domain)이 담당한다.
limit_req_zone $ckp_client_ip zone=linkos_api:10m rate=30r/s;
