name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: linkos, POSTGRES_PASSWORD: linkos, POSTGRES_DB: linkos_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U linkos" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgres://linkos:linkos@localhost:5432/linkos_test
      AUTH_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Unit + integration tests (domain, api against Postgres)
        run: pnpm test
      - name: Migration dry-run is idempotent
        run: pnpm db:migrate && pnpm db:migrate
      - name: Traceability gate (all 197 Feature IDs present)
        run: pnpm traceability --check
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: E2E (guest exchange → claim, QR final fallback)
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report }
  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t linkos:ci .
