# /etc/nginx/conf.d/proplus.conf — PROPLUS 전용 http 레벨 설정  (P-190)
#
# 왜 전용 존인가:
#   1) 공통 conf.d/ckp-hardening.conf 의 ckp_api 존은 10r/s 다. PROPLUS 의 공개 프로필
#      (/p/{slug})은 **비회원 유입 입구**이고(전략 §1) 한 화면이 조회 집계·배지 조회를
#      함께 호출하므로 그 한도에서는 정상 사용이 429 가 된다.
#   2) LINKOS 의 linkos_api 존(30r/s)을 공유하면 한쪽 트래픽이 다른 쪽을 굶긴다.
#      전략 §1 의 "배포 격리"는 레이트리밋 버킷에도 적용된다.
#
# 세밀한 행위별 제한은 앱이 담당한다(packages/domain/src/rateLimit.ts — login 5/15m,
# lead.create 5/10m, evidence.submit 20/1h …). 여기는 거친 DoS 방어 전용이다.
#
# 키 $ckp_client_ip 는 공통 conf.d/ckp-hardening.conf 가 정의한 Cloudflare 복원
# 클라이언트 IP 다(LINKOS 와 같은 키). conf.d 는 알파벳 순으로 읽히므로
# ckp-hardening.conf 가 먼저 로드된다.
#
# 30r/s(LINKOS)보다 낮은 20r/s 인 이유: PROPLUS 에는 SSE 재연결과 대시보드 다중 폴링이
# 없다. 한 화면당 API 호출 수가 더 적으므로 한도를 더 조일 수 있다.
limit_req_zone $ckp_client_ip zone=proplus_api:10m rate=20r/s;
