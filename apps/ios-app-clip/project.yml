# XcodeGen spec for the LINKOS App Clip target (F-042). Generate with `xcodegen generate` (macOS + Xcode 16+).
# For distribution the clip must be embedded in the full app (bundle id app.linkos.ios) generated by
# `cd apps/mobile && npx expo prebuild -p ios`: add this target to that workspace and put it in the host app's
# "Embed App Clips" build phase. Standalone, the target builds and runs in the simulator with _XCAppClipURL set.
name: LinkosClip
options:
  bundleIdPrefix: app.linkos
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: TEAMID
targets:
  LinkosClip:
    type: application.on-demand-install-capable
    platform: iOS
    sources:
      - path: LinkosClip
    info:
      path: LinkosClip/Info.plist
    entitlements:
      path: LinkosClip/LinkosClip.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.linkos.ios.Clip
        PRODUCT_NAME: LinkosClip
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      environmentVariables:
        _XCAppClipURL: https://linkos.app/c/ABC234
