# Render Blueprint — one-click deploy: https://render.com/deploy?repo=https://github.com/sooasim/linkos
databases:
  - name: linkos-db
    plan: basic-256mb
    databaseName: linkos
    postgresMajorVersion: "16"
services:
  - type: web
    name: linkos-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: /bin/sh /entrypoint.sh release
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: linkos-db, property: connectionString }
      - key: AUTH_SECRET
        generateValue: true
      - key: CREDENTIALS_KEY
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: SMTP_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
  - type: worker
    name: linkos-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: /bin/sh /entrypoint.sh worker
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: linkos-db, property: connectionString }
      - key: AUTH_SECRET
        fromService: { type: web, name: linkos-web, envVarKey: AUTH_SECRET }
      - key: CREDENTIALS_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
