# /etc/nginx/conf.d/proplus.conf — PROPLUS 전용 http 레벨 설정  (P-190)
#
# 왜 전용 존인가:
#   1) 공통 `ckp_api` 존은 10r/s 다. PROPLUS 의 공개 프로필(/p/{slug})은 **비회원 유입 입구**이고
#      (전략 §1) 한 화면이 조회 집계·배지 조회를 함께 호출하므로 그 한도에서는 정상 사용이 429 가 된다.
#   2) 다른 사이트의 존을 공유하면 한쪽 트래픽이 다른 쪽을 굶긴다. 전략 §1 의 "배포 격리" 는
#      레이트리밋 버킷에도 적용된다.
#
# 세밀한 행위별 제한은 앱이 담당한다(packages/domain/src/rateLimit.ts — login 5/15m,
# lead.create 5/10m, evidence.submit 20/1h, report.create 3/10m …). 여기는 거친 DoS 방어 전용이다.

# ── 레이트리밋 키: 방문자 단위 ───────────────────────────────────────────────
#
# Cloudflare 뒤에서 `$binary_remote_addr` 는 방문자가 아니라 **CF 엣지 IP** 다.
# 같은 엣지를 쓰는 사용자 수백 명이 한 통에 담겨 서로를 429 로 밀어낸다.
# (이 서버의 `conf.d/kbt-ratelimit.conf` 가 같은 문제를 "미뤄 둔 개선" 으로 적어 두었다 —
#  기존 존은 키를 바꾸면 reload 로 적용되지 않아 미뤘다. PROPLUS 는 **새 존**이라
#  그 제약이 없으므로 처음부터 올바른 키로 만든다.)
#
# CF 헤더가 없으면 소켓 주소로 떨어진다(로컬 테스트·직접 접속).
#
# ⚠️ 한계: `set_real_ip_from` 으로 CF 대역을 신뢰 설정하지 않았으므로, 오리진 IP 로 직접
#    들어오는 요청은 `CF-Connecting-IP` 를 위조해 버킷을 쪼갤 수 있다. 서버 전역 real_ip
#    설정은 다른 사이트에도 영향을 주므로 여기서 건드리지 않는다. 앱 계층 한도(P-189)가
#    로그인·상담 같은 민감한 행위를 따로 막고 있어 이 존은 어디까지나 거친 1차 방어다.
map $http_cf_connecting_ip $proplus_client {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}

limit_req_zone $proplus_client zone=proplus_api:10m rate=20r/s;
